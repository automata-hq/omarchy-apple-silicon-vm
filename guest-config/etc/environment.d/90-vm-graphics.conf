# virtio-gpu (virgl) under UTM/QEMU
WLR_NO_HARDWARE_CURSORS=1
AQ_NO_MODIFIERS=1
WLR_RENDERER_ALLOW_SOFTWARE=1
# Without software GL, GPU client windows (alacritty, chromium) map but do NOT
# paint: virgl does not deliver buffers Hyprland can composite. Only wl_shm
# clients (foot) render. With llvmpipe everything works.
# Verified NOT to fix it: AQ_NO_MODIFIERS, render:cm_enabled=false,
# render:explicit_sync (removed in Hyprland 0.56).
#LIBGL_ALWAYS_SOFTWARE=1
# Pick the virgl render node for the compositor (GPU compositing works; the
# dmabuf import issue affects GL clients only, so Qt apps get QT_QUICK_BACKEND=
# software via uwsm env.d instead):
AQ_DRM_DEVICES=/dev/dri/renderD128:/dev/dri/card0
